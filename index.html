<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Zork vNext — the Great Underground Empire, reimagined." />
    <title>Zork vNext</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%AE%3C/text%3E%3C/svg%3E" />
    <script type="module" crossorigin src="./assets/main-CBj_kudC.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="stylesheet" crossorigin href="./assets/main-bHYpWOt4.css">
  </head>
  <body>
    <div id="app">
      <section id="scene-wrap" aria-hidden="true">
        <canvas id="scene"></canvas>
        <div id="vignette"></div>
        <header id="statusbar">
          <span id="status-room">ZORK vNEXT</span>
          <span id="status-right">
            <span id="status-score" title="Score">0</span>
            <span class="status-sep">·</span>
            <span id="status-moves" title="Moves">0</span>
            <button id="sound-toggle" type="button" aria-label="Toggle sound">♪</button>
          </span>
        </header>
        <div id="room-title-card">
          <h1 id="room-title"></h1>
          <p id="room-subtitle"></p>
        </div>
      </section>

      <section id="console">
        <div id="transcript" role="log" aria-live="polite"></div>
        <div id="chips" role="toolbar" aria-label="Quick commands"></div>
        <form id="cmdform" autocomplete="off">
          <span class="prompt" aria-hidden="true">&gt;</span>
          <input
            id="cmd"
            type="text"
            inputmode="text"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            enterkeyhint="go"
            placeholder="What do you do?"
            aria-label="Command entry"
          />
          <button id="send" type="submit" aria-label="Enter command">↵</button>
        </form>
      </section>
    </div>
  </body>
</html>
