name: Deploy to GitHub Pages (branch)

# Classic branch-based Pages deploy: builds dist/ and pushes it to gh-pages.
# Exists as a workaround for the Actions-based deploy-pages@v4 pipeline
# getting stuck polling "purging_cdn" (a GitHub Pages backend issue, not a
# repo config problem — see github.com/orgs/community/discussions/49948).
# Requires Settings > Pages > Build and deployment > Source = "Deploy from
# a branch", branch gh-pages, folder / (root). deploy-pages.yml stays in
# place (workflow_dispatch only) so switching back is a one-line revert.

on:
  push:
    branches:
      - main
      - claude/zork-port-modern-ui-molbyu
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
